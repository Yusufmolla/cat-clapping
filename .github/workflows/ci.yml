name: CI (Check & Verify)

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests, build, and verify JetBrains plugin
        working-directory: jetbrains-plugin
        run: gradle check buildPlugin verifyPlugin

      - name: Upload test build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cat-clapping-jetbrains-ci-build
          path: jetbrains-plugin/build/distributions/*.zip
