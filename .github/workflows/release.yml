name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag (e.g. v0.1.0). Leave empty to only build and upload workflow artifact."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Determine plugin version and tag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG=""
          fi

          if [[ -n "$TAG" ]]; then
            VERSION="${TAG#v}"
          else
            VERSION="$(grep '^pluginVersion=' jetbrains-plugin/gradle.properties | cut -d= -f2)"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run unit tests and build JetBrains plugin
        working-directory: jetbrains-plugin
        run: gradle check buildPlugin -PpluginVersion=${{ steps.meta.outputs.version }}

      - name: Upload plugin ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cat-clapping-jetbrains-${{ steps.meta.outputs.version }}
          path: jetbrains-plugin/build/distributions/*.zip

      - name: Create GitHub Release
        if: steps.meta.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Cat Clapping ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: jetbrains-plugin/build/distributions/*.zip
