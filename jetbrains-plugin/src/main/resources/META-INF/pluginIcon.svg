<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
  <rect width="40" height="40" rx="8" fill="#1E1B2E"/>
  <!-- Ears -->
  <path d="M11 16 L10 6 L17 12 Z" fill="#46385E"/>
  <path d="M29 16 L30 6 L23 12 Z" fill="#46385E"/>
  <!-- Head & Body -->
  <ellipse cx="20" cy="18" rx="9" ry="7.5" fill="#3B2E52"/>
  <path d="M10 38 C10 28 13 24 20 24 C27 24 30 28 30 38 Z" fill="#2E2342"/>
  <!-- Eyes -->
  <ellipse cx="16.5" cy="16.5" rx="1.6" ry="1.3" fill="#E8DCC8"/>
  <ellipse cx="23.5" cy="16.5" rx="1.6" ry="1.3" fill="#E8DCC8"/>
  <circle cx="16.5" cy="16.5" r="0.7" fill="#161220"/>
  <circle cx="23.5" cy="16.5" r="0.7" fill="#161220"/>
  <!-- Grin -->
  <rect x="16" y="20.5" width="8" height="2.6" rx="1.2" fill="#F5ECD8"/>
  <line x1="18" y1="20.5" x2="18" y2="23.1" stroke="#3B2E52" stroke-width="0.6"/>
  <line x1="20" y1="20.5" x2="20" y2="23.1" stroke="#3B2E52" stroke-width="0.6"/>
  <line x1="22" y1="20.5" x2="22" y2="23.1" stroke="#3B2E52" stroke-width="0.6"/>
  <!-- Clapping paws -->
  <ellipse cx="16" cy="31" rx="3.2" ry="2.2" transform="rotate(-25 16 31)" fill="#706188"/>
  <ellipse cx="24" cy="31" rx="3.2" ry="2.2" transform="rotate(25 24 31)" fill="#706188"/>
  <!-- Clap spark lines -->
  <line x1="20" y1="26" x2="20" y2="24.2" stroke="#FFD166" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="17" y1="26.8" x2="15.7" y2="25.4" stroke="#FFD166" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="23" y1="26.8" x2="24.3" y2="25.4" stroke="#FFD166" stroke-width="1.2" stroke-linecap="round"/>
</svg>
